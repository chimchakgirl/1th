function field(parent,label,tag,value,fn,opts){parent.append(el('label','',label));let e=el(tag);if(opts)for(let [v,t] of opts){let o=el('option','',t);o.value=v;e.append(o)}e.value=value??'';e.onfocus=()=>{e.dataset.before=e.value;e.dataset.started='0'};e.oninput=()=>{if(e.dataset.started!=='1'){checkpoint();e.dataset.started='1'}fn(e.value);schedule();renderList()};if(tag==='select')e.onchange=()=>{renderGraph()};parent.append(e);return e}
function renderList(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('progress').textContent=`전체 ${data.nodes.length}개 · 완료 ${data.nodes.filter(n=>n.status==='완료').length}개 · 연결 ${data.edges.length}개`;$('list').replaceChildren();for(const n of data.nodes){if(f!=='전체'&&n.status!==f)continue;if(q&&!([n.title,n.script,n.notes,n.condition].join(' ').toLowerCase().includes(q)))continue;let b=btn(n.title.replaceAll('\n',' · '),()=>select(n.id,true));b.className=n.id===selected?'active':'';b.style.setProperty('--listcolor',types[n.type][2]);b.append(el('span','',n.id+' · '+n.status));$('list').append(b)}}
$('search').oninput=renderList;$('filter').onchange=renderList;
for(const [k,[name,tint]] of Object.entries(types)){let s=el('span','',name);s.style.background=tint;$('legend').append(s)}
function select(id,jump=false){selected=id;expanded.add(id);if(isMobile())showView("edit");render();if(jump&&!isMobile())requestAnimationFrame(()=>{let p=positions[id];if(p){$('stage').scrollTo({top:Math.max(0,p.y*scale-110),left:Math.max(0,p.x*scale-100),behavior:'smooth'})}})}
function toggle(id){if(isMobile()){select(id);return}if(expanded.has(id)){expanded.delete(id);if(selected===id)selected=null}else{expanded.add(id);selected=id}render()}
function renderGraph(){if(isMobile()&&document.body.dataset.view!=='graph')return;let ns=$('nodes');ns.replaceChildren();let ranks={},indeg={},out={};for(const n of data.nodes){ranks[n.id]=0;indeg[n.id]=0;out[n.id]=[]}for(const e of data.edges){if(e.from===e.to)continue;indeg[e.to]++;out[e.from].push(e.to)}let q=data.nodes.filter(n=>!indeg[n.id]).map(n=>n.id),visited=new Set();while(q.length){let a=q.shift();visited.add(a);for(let b of out[a]){ranks[b]=Math.max(ranks[b],ranks[a]+1);if(--indeg[b]===0)q.push(b)}}let max=Math.max(0,...Object.values(ranks));for(const n of data.nodes)if(!visited.has(n.id))ranks[n.id]=++max;let rows={};for(const n of data.nodes)(rows[ranks[n.id]]??=[]).push(n);let width=Math.max(740,...Object.values(rows).map(r=>r.length*310+80));let y=35;positions={};for(const row of Object.values(rows)){let h=0;row.forEach((n,i)=>{let box=el('div','node'+(n.id===selected?' selected':''));let t=types[n.type];box.style.setProperty('--tint',t[1]);box.style.setProperty('--stroke',t[2]);let x=(width-row.length*310)/2+i*310+33;box.style.left=x+'px';box.style.top=y+'px';let head=el('div','nodehead');head.tabIndex=0;head.setAttribute('role','button');head.setAttribute('aria-expanded',expanded.has(n.id));head.append(el('div','nt',n.title),el('span','',expanded.has(n.id)?'▴':'▾'));head.onclick=()=>toggle(n.id);head.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(n.id)}};box.append(head);let foot=el('div','nodefoot');foot.append(el('span','',n.id+' · '+n.status),el('span','',n.script.length+'자'));box.append(foot);if(expanded.has(n.id)){let pane=el('div','inline'),ta=el('textarea');ta.placeholder='대사와 지문을 작성하세요';ta.value=n.script;ta.onfocus=()=>{ta.dataset.started='0'};ta.oninput=()=>{if(ta.dataset.started!=='1'){checkpoint();ta.dataset.started='1'}n.script=ta.value;if(selected===n.id&&$('script'))$('script').value=n.script;foot.lastChild.textContent=n.script.length+'자';schedule();renderList()};pane.append(ta,btn('상세 편집',()=>select(n.id)));box.append(pane)}ns.append(box);positions[n.id]={x,y,w:244,h:box.offsetHeight};h=Math.max(h,box.offsetHeight)});y+=h+84}let height=y+40;let svg=$('wires');svg.setAttribute('width',width);svg.setAttribute('height',height);svg.replaceChildren();const S='http://www.w3.org/2000/svg';function s(tag,attrs){let z=document.createElementNS(S,tag);for(let [k,v] of Object.entries(attrs))z.setAttribute(k,v);return z}let defs=s('defs',{}),marker=s('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(s('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#9296a5'}));defs.append(marker);svg.append(defs);let grouped=new Map();for(const e of data.edges){let k=e.from+'|'+e.to;if(!grouped.has(k))grouped.set(k,[]);grouped.get(k).push(e)}for(let es of grouped.values()){let e=es[0],a=positions[e.from],b=positions[e.to];if(!a||!b)continue;let x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y,mid=(y1+y2)/2;let path=y2>y1?`M${x1} ${y1} V${mid} H${x2} V${y2}`:`M${x1} ${y1} H${a.x+a.w+22} V${b.y-18} H${x2} V${y2}`;svg.append(s('path',{d:path,fill:'none',stroke:'#9296a5','stroke-width':1.4,'marker-end':'url(#arrow)'}));let text=es.map(e=>e.label).filter(Boolean).join(' / ');if(text){let tx=(x1+x2)/2,ty=mid-7;let lab=s('text',{x:tx,y:ty,'font-size':11,'text-anchor':'middle',fill:'#555b6a',stroke:'#f5f6f8','stroke-width':4,'paint-order':'stroke'});lab.textContent=text;svg.append(lab)}}$('graph').style.width=width+'px';$('graph').style.height=height+'px';applyZoom()}
function applyZoom(){$('graph').style.transform=`scale(${scale})`;$('space').style.width=parseFloat($('graph').style.width)*scale+'px';$('space').style.height=parseFloat($('graph').style.height)*scale+'px';$('zoom').textContent=Math.round(scale*100)+'%'}
$('minus').onclick=()=>{scale=Math.max(.25,scale-.1);applyZoom()};$('plus').onclick=()=>{scale=Math.min(2,scale+.1);applyZoom()};$('zoom').onclick=()=>{scale=1;applyZoom()};$('fit').onclick=()=>{scale=Math.min(1,Math.max(.25,($('stage').clientWidth-20)/parseFloat($('graph').style.width)));applyZoom()};$('collapse').onclick=()=>{expanded.clear();selected=null;render()};
function renderEditor(){let p=$('editor'),n=node(selected);p.replaceChildren();if(!n){p.append(el('div','empty','장면을 클릭하면 원고 편집창이 열립니다.'));return}let top=el('div','row');top.append(el('h2','','장면 편집 · '+n.id),btn(isMobile()?'← 목록':'닫기',()=>{if(isMobile()){save();showView(lastView);return}expanded.delete(n.id);selected=null;render()}));p.append(top);let title=field(p,'이벤트 제목','textarea',n.title,v=>{n.title=v;let pos=$('nodes').querySelector('.selected .nt');if(pos)pos.textContent=v});title.rows=2;title.onblur=renderGraph;field(p,'집필 상태','select',n.status,v=>n.status=v,['미작성','집필 중','퇴고 필요','완료'].map(v=>[v,v]));let sc=field(p,'시나리오 · 대사 및 지문','textarea',n.script,v=>{n.script=v;let t=$('nodes').querySelector('.selected textarea');if(t)t.value=v;let f=$('nodes').querySelector('.selected .nodefoot span:last-child');if(f)f.textContent=v.length+'자'});sc.id='script';sc.rows=12;p.append(btn('원고 복사',()=>copy(n.script)));let advanced=el('details','mobileAdvanced');advanced.open=!isMobile();advanced.append(el('summary','','메모 · 변수 · 분기 설정'));p.append(advanced);p=advanced;field(p,'분류','select',n.type,v=>n.type=v,Object.entries(types).map(([k,v])=>[k,v[0]]));let memo=field(p,'연출 / 퇴고 메모','textarea',n.notes,v=>n.notes=v);memo.rows=3;field(p,'진입 조건 / 변수 메모','textarea',n.condition,v=>n.condition=v).rows=2;field(p,'YLOVE 증감 (메모)','input',n.y,v=>n.y=v);field(p,'RLOVE 증감 (메모)','input',n.r,v=>n.r=v);p.append(el('h3','','다음 장면 / 선택지'));let edges=data.edges.map((e,i)=>[e,i]).filter(([e])=>e.from===n.id);for(const [e,i] of edges){let wrap=el('div','edgeRow');let dest=field(wrap,'연결 대상','select',e.to,v=>e.to=v,data.nodes.map(x=>[x.id,x.id+' · '+x.title.replaceAll('\n',' ')]));dest.onchange=renderGraph;let label=field(wrap,'선택지 / 화살표 문구','input',e.label,v=>e.label=v);label.onblur=renderGraph;wrap.append(btn('대상으로 이동',()=>select(e.to,true)),btn('연결 삭제',()=>change(()=>data.edges.splice(i,1)),'danger'));p.append(wrap)}p.append(btn('＋ 연결 추가',()=>{let target=data.nodes.find(x=>x.id!==n.id);if(tar function render(){renderList();renderGraph();renderEditor();buttons()}
$('add').onclick=()=>{let s=$('insertEdge');s.replaceChildren();let o=el('option','','독립 장면');o.value='-1';s.append(o);data.edges.forEach((e,i)=>{let o=el('option','',node(e.from).title.replaceAll('\n',' ')+' → '+node(e.to).title.replaceAll('\n',' ')+(e.label?' ['+e.label+']':''));o.value=i;s.append(o)});if(selected){let i=data.edges.findIndex(e=>e.from===selected);if(i>=0)s.value=i}$('newTitle').value='';$('newDialog').showModal()};$('cancel').onclick=()=>$('newDialog').close();$('create').onclick=()=>{let title=$('newTitle').value.trim();if(!title)return toast('제목을 입력하세요');let idx=Number($('insertEdge').value),id='SC'+Date.now().toString(36);change(()=>{data.nodes.push({id,title,type:'common',script:'',notes:'',status:'미작성',condition:'',y:'',r:''});if(idx>=0){let e=data.edges[idx];data.edges.splice(idx,1,{from:e.from,to:id,label:e.label},{from:id,to:e.to,label:''})}selected=id;expanded.add(id)});$('newDialog').close();select(id,true)};
function download(name,body,type){let url=URL.createObjectURL(new Blob([body],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function jsonFile(){return new File([JSON.stringify(data,null,2)],'scenario_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',{type:'application/json'})}
$('backup').onclick=async()=>{save();let f=jsonFile();if(window.showSaveFilePicker){try{let h=await window.showSaveFilePicker({suggestedName:f.name,types:[{description:'시나리오 JSON',accept:{'application/json':['.json']}}]});let w=await h.createWritable();await w.write(f);await w.close();toast('JSON 파일 저장 완료');return}catch(e){if(e.name==='AbortError')return}}download(f.name,await f.text(),'application/json');toast('JSON 다운로드 요청 · 다운로드 폴더 확인')};
$('shareJson').onclick=async()=>{save();let f=jsonFile();if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Scenario Studio JSON'});return}catch(e){if(e.name==='AbortError')return}}download(f.name,await f.text(),'application/json');toast('공유 미지원 · JSON 다운로드 요청')};$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;let next=validate(JSON.parse(await f.text()));if(confirm('현재 프로젝트를 불러온 파일로 교체할까요? 먼저 백업하는 것을 권장합니다.'))change(()=>{data=next;selected=null;expanded.clear()})}catch(e){alert('불러오기 실패: '+e.message)}finally{$('file').value=''}};
$('export').onclick=()=>download('scenario_manuscript.txt',data.nodes.map(n=>`[${n.id}] ${n.title}\n상태: ${n.status}\n\n${n.script}\n\n메모: ${n.notes}\n조건: ${n.condition}\nYLOVE: ${n.y} / RLOVE: ${n.r}\n`+data.edges.filter(e=>e.from===n.id).map(e=>`→ ${e.label||'다음'} : ${node(e.to).title.replaceAll('\n',' ')}`).join('\n')).join('\n\n────────────────────\n\n'),'text/plain;charset=utf-8');
async function copy(t){try{await navigator.clipboard.writeText(t);toast('복사 완료')}catch{let a=el('textarea');a.value=t;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();toast(ok?'복사 완료':'복사 실패')}}
$('mermaid').onclick=()=>{let esc=s=>s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('\n','<br/>');let lines=['flowchart TD',...data.nodes.map(n=>` ${n.id}${n.type==='decision'?'{':'['}"${esc(n.title)}"${n.type==='decision'?'}':']'}`),...data.edges.map(e=>` ${e.from} -->${e.label?'|'+esc(e.label).replaceAll('|','&#124;')+'|':''} ${e.to}`),...Object.entries(types).map(([k,v])=>` classDef ${k} fill:${v[1]},stroke:${v[2]},color:#292b32`),...Object.keys(types).filter(k=>data.nodes.some(n=>n.type===k)).map(k=>` class ${data.nodes.filter(n=>n.type===k).map(n=>n.id).join(',')} ${k}`)];copy(lines.join('\n'))};
const mq=window.matchMedia('(max-width:1000px)');function isMobile(){return mq.matches}let lastView='list';function showView(v){if(v!=='edit')lastView=v;document.body.dataset.view=v;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===v);b.setAttribute('aria-pressed',String(b.dataset.tab===v))});if(isMobile()){window.scrollTo(0,0);if(v==='graph')requestAnimationFrame(()=>{renderGraph();if(!graphOpened){$('fit').click();graphOpened=true}})}}let graphOpened=false;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{save();showView(b.dataset.tab)});$('mobileMenu').onclick=()=>{let h=document.querySelector('header'),open=h.classList.toggle('menuOpen');$('mobileMenu').setAttribute('aria-expanded',String(open))};document.querySelectorAll('header>button:not(#mobileMenu)').forEach(b=>b.addEventListener('click',()=>{document.querySelector('header').classList.remove('menuOpen');$('mobileMenu').setAttribute('aria-expanded','false')}));mq.addEventListener('change',()=>{render();if(isMobile())showView('list');else $('fit').click()});render();showView('list');if(!isMobile())$('fit').click();
