/button><button id="cancel">취소</button></div></dialog>

const INITIAL = {nodes:[],edges:[],routeChoices:{},presets:[]};
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x)), KEY='scenario-studio-v1';
const types={common:['공통','#f4f1ed','#b6aea3'],decision:['선택 / 조건','#f3e4c4','#b59a65'],yushi:['유우시','#dfe8f8','#819ac3'],riku:['리쿠','#dcede2','#7b9f87'],report:['외도 / 고발','#f5dcdc','#c58383'],happy:['해피 엔딩','#dcebd9','#7fa576'],bad:['배드 엔딩','#e8c4c8','#ae6975'],normal:['노멀 엔딩','#e7e7e7','#999'],hidden:['히든 엔딩','#e6d9f4','#a58ac2']};
let data=clone(INITIAL),selected=null,expanded=new Set(),scale=1,history=[],future=[],timer=null,toastTimer,positions={};
function validate(d){if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error('올바른 프로젝트 파일이 아닙니다.');let ids=new Set();for(const n of d.nodes){if(typeof n.id!=='string'||typeof n.title!=='string'||ids.has(n.id))throw Error('장면 ID 오류');ids.add(n.id);for(const k of ['script','notes','y','r','condition','date','time','participants','routeCondition','routeSet'])n[k]=String(n[k]??'');if(!types[n.type])n.type='common';if(!['미작성','집필 중','퇴고 필요','완료'].includes(n.status))n.status='미작성';}for(const e of d.edges){if(!ids.has(e.from)||!ids.has(e.to))throw Error('연결 대상이 없습니다.');e.label=String(e.label??'')}d.routeChoices=d.routeChoices&&typeof d.routeChoices==='object'&&!Array.isArray(d.routeChoices)?d.routeChoices:{};d.presets=Array.isArray(d.presets)?d.presets:[];return d}
try{let s=localStorage.getItem(KEY);if(s)data=validate(JSON.parse(s));}catch(e){$('saveStatus').textContent='저장소 읽기 실패 · 백업 확인'}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2500)}
function save(){clearTimeout(timer);try{localStorage.setItem(KEY,JSON.stringify(data));$('saveStatus').textContent='자동 저장 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}catch(e){$('saveStatus').textContent='자동 저장 실패 · JSON 백업 필요'}}
function schedule(){ $('saveStatus').textContent='저장 중…';clearTimeout(timer);timer=setTimeout(save,250)}

function buttons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}
function change(fn){checkpoint();fn();save();render()}
function restore(src,dst){if(!src.length)return;dst.push(clone(data));data=src.pop();if(!node(selected))selected=null;expanded=new Set([...expanded].filter(id=>node(id)));save();render()}
$('undo').onclick=()=>restore(history,future);$('redo').onclick=()=>restore(future,history);
function node(id){return data.nodes.find(n=>n.id===id)}
function el(tag,cls,text){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function btn(text,fn,cls){let b=el('button',cls,text);b.onclick=fn;return b}
function field(parent,label,tag,value,fn,opts){parent.append(el('label','',label));let e=el(tag);if(opts)for(let [v,t] of opts){let o=el('option','',t);o.value=v;e.append(o)}e.value=value??'';e.onfocus=()=>{e.dataset.before=e.value;e.dataset.started='0'};e.oninput=()=>{if(e.dataset.started!=='1'){checkpoint();e.dataset.started='1'}fn(e.value);schedule();renderList()};if(tag==='select')e.onchange=()=>{renderGraph()};parent.append(e);return e}
let routeMode='all', personFilter='';
function isTimelineEvent(n){return n.type!=='decision' && n.timeline!==false;}
function participants(n){return [...new Set(String(n.participants||'').split(/[,，;\n]/).map(x=>x.trim()).filter(Boolean))]}
function dateKey(n){let raw=String(n.date||'').trim();if(!raw){let m=n.title.match(/^(\d{1,2})[.\/-](\d{1,2})/);if(m)raw=m[0]}let m=raw.match(/^(?:(\d{4})[-./])?(\d{1,2})[-./](\d{1,2})$/);return m?`${m[1]||'0000'}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'9999-99-99'}
function clauses(s){return String(s||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)}
function checkCondition(s,vars){return clauses(s).every(c=>{let m=c.match(/^([^=<>!]+?)\s*(>=|<=|!=|=|>|<)\s*(.+)$/);if(!m)return false;let a=vars[m[1].trim()],b=m[3].trim();if(a===undefined)return false;return m[2]==='='?String(a)===b:m[2]==='!='?String(a)!==b:Number.isFinite(Number(a))&&Number.isFinite(Number(b))&&({'>':Number(a)>Number(b),'<':Number(a)<Number(b),'>=':Number(a)>=Number(b),'<=':Number(a)<=Number(b)})[m[2]]})}

let playback=null;
function playStart(){if(!data.nodes.length){toast('먼저 JSON을 불러오거나 장면을 추가하세요.');return}save();playback={project:clone(data),steps:[],roots:[]};let p=playback.project;playback.roots=p.nodes.filter(n=>!p.edges.some(e=>e.to===n.id));if(!playback.roots.length)playback.roots=p.nodes.slice(0,1);if(!$('playDialog').open)$('playDialog').showModal();if(playback.roots.length===1)playEnter(playback.roots[0].id,{},null);else playRender()}
function playNode(id){return playback.project.nodes.find(n=>n.id===id)}
function playEnter(id,vars,edge){let n=playNode(id);if(!n)return;let v={...vars};for(let c of clauses(n.routeSet)){let i=c.indexOf('=');if(i>0)v[c.slice(0,i).trim()]=c.slice(i+1).trim()}playback.steps.push({id,vars:v,edge:edge?clone(edge):null});playRender()}
function playRender(){let b=$('playBody');b.replaceChildren();b.scrollTop=0;$('playDialog').scrollTop=0;if(!playback.steps.length){b.append(el('h2','','시작 장면 선택'));let c=el('div','playchoices');for(let n of playback.roots)c.append(btn(n.title,()=>playEnter(n.id,{},null),'primary'));b.append(c);return}let step=playback.steps.at(-1),n=playNode(step.id);b.append(el('div','muted',`${playback.steps.length}번째 노드 · ${n.type==='decision'?'분기 선택':types[n.type][0]}`));if(step.edge?.label)b.append(el('div','playedge','선택한 연결: '+step.edge.label));b.append(el('h2','',n.title));if(n.date||n.time||n.participants)b.append(el('div','muted',[n.date,n.time,n.participants].filter(Boolean).join(' · ')));if(n.script)b.append(el('div','manuscript',n.script));else if(n.type!=='decision')b.append(el('div','manuscript muted','아직 작성된 원고가 없습니다.'));let edges=playback.project.edges.filter(e=>e.from===n.id);let valid=edges.filter(e=>checkCondition(playNode(e.to).routeCondition,step.vars));let c=el('div','playchoices');if(edges.length>1)b.append(el('h3','','다음 선택지를 골라주세요.'));if(!edges.length)b.append(el('h3','','— 루트 종료 —'));else if(!valid.length)b.append(el('p','playwarn','현재 변수로 진입 가능한 연결이 없습니다. 이전 선택 또는 원고의 루트 조건을 확인하세요.'));for(let e of edges){let target=playNode(e.to);let label=edges.length===1?'다음 ▶'+(e.label?' · '+e.label:''):(e.label||target.title);let button=btn(label,()=>playEnter(e.to,step.vars,e),'primary');if(!valid.includes(e)){button.disabled=true;button.textContent+=' (조건 미충족)'}c.append(button)}b.append(c);let nav=el('div','playnav');let back=btn('← 이전',()=>{playback.steps.pop();playRender()});back.disabled=playback.steps.length===1&&playback.roots.length===1;nav.append(back,btn('현재 장면 분기도에서 보기',()=>{let id=n.id;$('playDialog').close();selected=id;showView('graph');renderGraph();requestAnimationFrame(()=>{let p=positions[id];if(p)$('stage').scrollTo({top:Math.max(0,p.y*scale-100),left:Math.max(0,p.x*scale-80)})})}));b.append(nav);let trail=el('details');trail.append(el('summary','','지나온 경로 · '+playback.steps.length+'개'));let ol=el('ol');for(let st of playback.steps)ol.append(el('li','', (st.edge?.label?st.edge.label+' → ':'')+playNode(st.id).title));trail.append(ol);b.append(trail)}
$('play').onclick=playStart;$('playRestart').onclick=playStart;$('playClose').onclick=()=>$('playDialog').close();
</script></body></html>
